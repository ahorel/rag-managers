services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: matchconsult_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # Dashboard : http://IP_SERVEUR:6333/dashboard

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matchconsult_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - CV_DIRECTORY=./data/cvs
      - DEMO_MODE=false
      - GROQ_MODEL=llama-3.1-8b-instant
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend/data:/app/data   # CVs persistants entre redémarrages
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,json,sys; d=json.loads(urllib.request.urlopen('http://localhost:8000/api/health',timeout=5).read()); sys.exit(0 if d.get('model_ready') and d.get('cvs_loaded',0)>0 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchconsult_frontend
    restart: unless-stopped
    ports:
      - "80:80"   # Interface web : http://IP_SERVEUR
    depends_on:
      - backend

  # ── Service de tests ────────────────────────────────────────────────────────
  # Lancé uniquement avec : docker compose --profile test run --rm tests
  # Démarre APRÈS que le backend soit healthy (modèle chargé + CVs indexés)
  tests:
    image: python:3.12-slim
    profiles: ["test"]
    volumes:
      - ./tests:/tests:ro                    # script en lecture seule
      - ./tests/results:/tests/results:rw    # résultats en écriture
    environment:
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_RECIPIENTS=${SMTP_RECIPIENTS:-}
    command: python3 /tests/run_scenarios.py http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    # Pas de restart — le container s'arrête après les tests

volumes:
  qdrant_data:
